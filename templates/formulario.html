{% extends "base.html" %}

{% block page_content %}
    <div class="page-header">
        <h1>Hello, {% if nome %}{{ nome }}{% else %}Stranger{% endif %}!</h1>
    </div>
    <div class="page-content">
        <form method="POST">
            {{ form.hidden_tag() }}
            {{ form.name.label }} {{ form.name(id='nomeText') }}
            {{ form.submit() }}
        </form>
    </div>
{% endblock %}
