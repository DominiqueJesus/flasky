{% extends "base.html" %}

{% import "bootstrap/wtf.html" as wt %}

{% block page_content %}

    <div class="page-header">

        <h1>Hello, {% if nome %}{{ nome }}{% else %}Stranger{% endif %}!</h1>

        {% if known %}
            <p>Happy to see you again!</p>
        {% else %}
            <p>Pleased to meet you!</p>
        {% endif %}

    </div>

    <div class="page-content">

        {{ wt.quick_form(main) }}

    </div>

{% endblock %}
