{% extends "base.html" %}

{% import "bootstrap/wtf.html" as wt %}

{% block page_content %}

    <div class="page-header">

        <h1>Olá, {% if nome %}{{ nome }}{% else %}Estranho{% endif %}!</h1>

        {% if known %}
            <p>Feliz em te ver novamente!</p>
        {% else %}
            <p>Prazer em te conhecer!</p>
        {% endif %}

    </div>

    <div class="page-content">

        {{ wt.quick_form(main) }}

    </div>
